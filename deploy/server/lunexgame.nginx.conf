# Подключается ВНУТРИ существующего server { } для tts-ufa.ru (include), весь конфиг сайта не заменяется:
#   include /etc/nginx/snippets/lunexgame.conf;
# __PORT__ подставляет install.sh из проверенного свободного порта. Путь с учётом регистра.
location ^~ /LunexGame/ {
    proxy_pass http://127.0.0.1:__PORT__;   # без URI: префикс /LunexGame/ передаётся как есть
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;     # будущие WebSocket
    proxy_set_header Connection $connection_upgrade_lunexgame;
    proxy_read_timeout 75s;
}
location = /LunexGame { return 301 /LunexGame/; }
