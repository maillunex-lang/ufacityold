name: client-android

on:
  push:
    branches: [main]
    paths: ['client/**', 'server/**', 'tools/**', '.github/workflows/client-android.yml', '.github/actions/**']
  pull_request:
    paths: ['client/**', 'server/**', 'tools/**', '.github/workflows/client-android.yml', '.github/actions/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7-stable        # закреплено; смена версии — отдельное решение
  GODOT_TEMPLATES_DIR: 4.7.stable
  APK_MAX_BYTES: 94371840          # 90 МиБ, лимит из ТЗ

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Собрать сервер для интеграционной проверки клиента
        working-directory: server
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/lunexgame-server" ./cmd/lunexgame

      - uses: ./.github/actions/setup-godot-android

      - name: Импорт ресурсов проекта
        run: '"$GODOT" --headless --path client --import'

      - name: 'Интеграционная проверка: клиент Godot и настоящий сервер (вход, ресурсы, докачка, повреждения)'
        run: tools/smoke-assets.sh "$GODOT" "$RUNNER_TEMP/lunexgame-server"

      - name: Экспорт Android APK (arm64-v8a, debug)
        run: |
          mkdir -p build
          "$GODOT" --headless --path client --export-debug "Android" "$GITHUB_WORKSPACE/build/lunexgame-debug.apk"

      - name: Проверка размера и содержимого APK
        run: |
          f=build/lunexgame-debug.apk
          size=$(stat -c %s "$f"); echo "Размер APK: $size байт ($((size/1024/1024)) МиБ), лимит $APK_MAX_BYTES"
          [ "$size" -le "$APK_MAX_BYTES" ] || { echo "APK больше лимита"; exit 1; }
          aapt2=$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump badging "$f" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|native-code)" | tee build/badging.txt
          grep -q "name='com.lunexgame.samraya'" build/badging.txt
          grep -q "android.permission.INTERNET" build/badging.txt
          grep -q "arm64-v8a" build/badging.txt

      - name: Проверка release-экспорта и подписи (одноразовый ключ, артефакт не публикуется)
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" client/export_presets.cfg
          "$GODOT" --headless --path client --export-release "Android" "$GITHUB_WORKSPACE/build/release-check.apk"
          apksigner=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "build/release-check.apk" | head -3
          size=$(stat -c %s build/release-check.apk); echo "release-APK: $size байт"
          [ "$size" -le "$APK_MAX_BYTES" ]
          rm -f build/release-check.apk

      - name: Экспорт Web (PWA) и контроль размера
        run: |
          mkdir -p build/web
          "$GODOT" --headless --path client --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
          wasm=$(stat -c %s build/web/index.wasm); gz=$(gzip -9 -c build/web/index.wasm | wc -c)
          echo "Web: index.wasm $wasm байт, gzip $gz байт; pck $(stat -c %s build/web/index.pck) байт"
          [ "$wasm" -le 52428800 ] || { echo "index.wasm больше 50 МиБ"; exit 1; }
          test -f build/web/index.manifest.json && test -f build/web/index.service.worker.js

      - uses: actions/upload-artifact@v4
        with:
          name: lunexgame-web-${{ github.sha }}
          path: build/web/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: lunexgame-debug-apk-${{ github.sha }}
          path: |
            build/lunexgame-debug.apk
            build/badging.txt
          retention-days: 14

  release-apk:
    # Подписанный ПОСТОЯННЫМ ключом APK. Только для push в main и только в окружении android-signing
    # (секреты не доступны проверкам pull request).
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: android-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Проверить, что ключ настроен
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ] || [ -z "$AL" ]; then
            echo "::notice::Постоянный ключ подписи не настроен (секреты окружения android-signing). Release-APK не собирается. См. docs/SIGNING.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.configured == 'true'
        uses: ./.github/actions/setup-godot-android
      - name: Подготовить ключ
        if: steps.key.outputs.configured == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Импорт ресурсов проекта
        if: steps.key.outputs.configured == 'true'
        run: '"$GODOT" --headless --path client --import'
      - name: Экспорт release-APK
        if: steps.key.outputs.configured == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.p12
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" client/export_presets.cfg
          mkdir -p build
          "$GODOT" --headless --path client --export-release "Android" "$GITHUB_WORKSPACE/build/lunexgame.apk"
      - name: Проверить подпись и размер
        if: steps.key.outputs.configured == 'true'
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apksigner=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/lunexgame.apk | tee build/cert.txt
          actual=$(grep -m1 "certificate SHA-256 digest" build/cert.txt | sed 's/.*: //' | tr -d ':' | tr 'a-f' 'A-F')
          want=$(printf '%s' "$EXPECTED" | tr -d ': ' | tr 'a-f' 'A-F')
          if [ -z "$want" ]; then echo "::warning::Переменная ANDROID_CERT_SHA256 не задана — отпечаток не сверяется (задайте её, см. docs/SIGNING.md)"
          elif [ "$actual" != "$want" ]; then echo "ОТПЕЧАТОК КЛЮЧА НЕ СОВПАЛ: ожидался $want, получен $actual"; exit 1
          else echo "отпечаток ключа совпал"; fi
          size=$(stat -c %s build/lunexgame.apk); echo "APK: $size байт, лимит $APK_MAX_BYTES"
          [ "$size" -le "$APK_MAX_BYTES" ]
          "$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)" dump badging build/lunexgame.apk | grep -E "^package" | tee build/badging.txt
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.configured == 'true'
        with:
          name: lunexgame-release-apk-${{ github.sha }}
          path: |
            build/lunexgame.apk
            build/cert.txt
            build/badging.txt
          retention-days: 30
      - name: Удалить ключ с раннера
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
